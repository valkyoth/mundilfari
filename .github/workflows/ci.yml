name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Install security tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      - name: Install SBOM tool
        run: cargo install --locked cargo-sbom --version 0.10.0

      - name: Run local check gate
        run: scripts/checks.sh

      - name: Check dependency policy
        run: cargo deny check

      - name: Check RustSec advisories
        run: cargo audit

      - name: Verify committed SBOM
        run: scripts/generate-sbom.sh --check

  supported-hosts:
    name: Host ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test all workspace features
        run: cargo test --workspace --all-features

  portable-targets:
    name: Portable core ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-apple-darwin
          - aarch64-linux-android
          - aarch64-apple-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install portable target
        run: rustup target add ${{ matrix.target }}

      - name: Check no_std workspace
        run: >-
          cargo check --workspace --no-default-features
          --target ${{ matrix.target }}

  msrv:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.90.0
          - 1.91.0
          - 1.91.1
          - 1.92.0
          - 1.93.0
          - 1.93.1
          - 1.94.0
          - 1.94.1
          - 1.95.0
          - 1.96.0
          - 1.96.1
          - 1.97.0
          - 1.97.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal

      - name: Check published workspace
        run: cargo +${{ matrix.rust }} check --workspace --all-features
